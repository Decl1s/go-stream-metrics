name: Проверки Go и архив исходников
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Показать фактические версии
        run: go version
      - name: Проверить Go
        run: go test ./...
      - name: Проверить типичные ошибки Go
        run: go vet ./...
      - name: Проверить публикацию
        run: python -m unittest discover -s tests -v
      - name: Проверить исходники
        run: python scripts/check_public.py
      - name: Проверить собранный инструмент на демо
        run: python scripts/smoke_check.py
      - name: Собрать исходный архив
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-${{ matrix.os }}
          path: |
            artifacts/go-stream-metrics-0.1.0.zip
            artifacts/SHA256SUMS
          if-no-files-found: error
